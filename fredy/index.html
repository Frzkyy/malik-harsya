<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Mahasiswa UNRI (!!AI SLOP!!)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-top">
      <h1>Profil Mahasiswa UNRI</h1>
      <!-- Tombol Setting Tema Gelap/Terang -->
      <button id="themeToggle" type="button" class="theme-toggle">🌙 Mode Gelap</button>
    </div>
    <!-- Area Ucapan Dinamis -->
    <p id="greeting" class="greeting">Memuat ucapan...</p>
  </header>

  <main class="container">

    <!-- ===== Kartu Mahasiswa ===== -->
    <section class="card profile-card">
      <h2>Kartu Mahasiswa</h2>
      <div class="profile-info">
        <img id="profilePhoto" src="https://via.placeholder.com/120" alt="Foto Profil" class="profile-photo">
        <!-- Teks di bawah ini akan diperbarui JavaScript setelah form berhasil disubmit -->
        <h3 id="profileName" class="profile-name">Mahasigma UNRI</h3>
        <p id="profileRole" class="profile-role">Provinsi Riau</p>
      </div>
    </section>

    <!-- ===== Fitur 1: Tombol Penghitung ===== -->
    <section class="card counter-card">
      <h2>Tambah ciek da</h2>
      <p>Bara banyak: <span id="counterValue" class="counter-value">0</span></p>
      <button id="counterButton" type="button" class="btn">Tambah</button>
    </section>

    <!-- ===== Fitur 2: Form Data Mahasiswa dengan Validasi ===== -->
    <section class="card form-card">
      <h2>Form Data Mahasiswa</h2>
      <form id="contactForm" class="contact-form" novalidate>
        <div class="form-group">
          <label for="nama">Nama</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda">
        </div>

        <div class="form-group">
          <label for="nim">NIM</label>
          <input type="text" id="nim" name="nim" placeholder="Contoh: 25071204707">
        </div>

        <div class="form-group">
          <label for="jurusan">Jurusan</label>
          <input type="text" id="jurusan" name="jurusan" placeholder="Contoh: Teknik Informatika">
        </div>

        <div class="form-group">
          <label for="fotoProfil">Foto Profil (opsional)</label>
          <input type="file" id="fotoProfil" name="fotoProfil" accept="image/*">
        </div>

        <button id="submitButton" type="submit" class="btn">Kirim</button>

        <!-- Elemen untuk menampilkan pesan error/sukses validasi -->
        <div id="formError" class="form-error"></div>
      </form>
    </section>

  </main>

  <footer class="footer">
    <p>Profil Interaktif Mahasiswa UNRI</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
